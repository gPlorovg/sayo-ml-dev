# ============================================================================
# nemo — model configuration
# ============================================================================
# Adapter: model_repository/adapters/nemo.py
# ============================================================================

# Metadata
schema_version: 1
id: "nemo_ru"
adapter: "nemo"
description: "Cache-aware"

# Model properties
language_code: "ru"
sample_rate: 16000

# Optional latency hint in milliseconds
latency: 500

decoder_type: "ctc"        # "rnnt" or "ctc"
chunk_ms: 560               # lookahead (480) + encoder step (80)
chunk_samples: 8960          # sample_rate * chunk_ms / 1000

# Streaming: max length of transcript text (suffix of full hypothesis). 0 = no limit.
stream_transcript_max_chars: 150

# Model artifacts.
# Dependencies are declared in files next to this config:
#   - requirements.lock
#   - system-packages.txt
weights:
  revision: "v1"
  artifacts:
    - path: "weights/sayo.nemo"
    # я не знаю как сделать sha256 и какую ссылку указать сейчас, пока хочу тестирование на локальной модели
      # uri: "https://example.com/model.safetensors"
      # sha256: "<checksum>"
      # required: true

# Runtime hints
runtime:
  min_vram_gb: 4.0
  max_batch_size: 8
  quantization: null
