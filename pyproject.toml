[project]
name = "sayo-ml-dev"
version = "0.1.0"
description = "ML develop and testing tooling for SAYO system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=25.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[toll.ruff.lint]
# E, W — Flake8 (ошибки и предупреждения)
# F — Pyflakes
# I — Isort (сортировка импортов)
# B — Flake8-bugbear (поиск вероятных багов)
# C4 — Flake8-comprehensions
select = ["E", "W", "F", "I", "B", "C4"]
ignore = []

[toll.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "grpcio-tools==1.80.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]
